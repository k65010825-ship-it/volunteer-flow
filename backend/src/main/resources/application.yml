spring:
  application:
    name: volunteerflow-backend
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.40.144}:${DB_PORT:3307}/${DB_NAME:volunteer_flow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:192.168.40.144}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:2}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

volunteerflow:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    key-secret: ${RATE_LIMIT_KEY_SECRET:}
    login:
      ip:
        limit: ${RATE_LIMIT_LOGIN_IP_LIMIT:20}
        window: ${RATE_LIMIT_LOGIN_IP_WINDOW:1m}
      username:
        limit: ${RATE_LIMIT_LOGIN_USERNAME_LIMIT:5}
        window: ${RATE_LIMIT_LOGIN_USERNAME_WINDOW:5m}
    registration:
      limit: ${RATE_LIMIT_REGISTRATION_LIMIT:3}
      window: ${RATE_LIMIT_REGISTRATION_WINDOW:10s}
    promotion-response:
      limit: ${RATE_LIMIT_PROMOTION_LIMIT:5}
      window: ${RATE_LIMIT_PROMOTION_WINDOW:1m}
    static-checkin:
      limit: ${RATE_LIMIT_STATIC_CHECKIN_LIMIT:5}
      window: ${RATE_LIMIT_STATIC_CHECKIN_WINDOW:1m}
    dynamic-checkin:
      limit: ${RATE_LIMIT_DYNAMIC_CHECKIN_LIMIT:10}
      window: ${RATE_LIMIT_DYNAMIC_CHECKIN_WINDOW:1m}
    local-login:
      max-entries: ${RATE_LIMIT_LOCAL_LOGIN_MAX_ENTRIES:10000}
      cleanup-interval: ${RATE_LIMIT_LOCAL_LOGIN_CLEANUP_INTERVAL:1m}
  cache:
    activity-detail:
      ttl: ${ACTIVITY_DETAIL_CACHE_TTL:5m}
      max-jitter: ${ACTIVITY_DETAIL_CACHE_MAX_JITTER:60s}
  checkin:
    finalization:
      scan-delay: ${ACTIVITY_FINALIZATION_SCAN_DELAY:30s}
      batch-size: ${ACTIVITY_FINALIZATION_BATCH_SIZE:100}
      max-batches-per-run: ${ACTIVITY_FINALIZATION_MAX_BATCHES_PER_RUN:10}
    dynamic-code:
      window: ${DYNAMIC_CHECKIN_WINDOW:30s}
      ttl: ${DYNAMIC_CHECKIN_TTL:45s}
      token-bytes: ${DYNAMIC_CHECKIN_TOKEN_BYTES:24}
  registration:
    promotion-expiry:
      scan-delay: ${PROMOTION_EXPIRY_SCAN_DELAY:30s}
      batch-size: ${PROMOTION_EXPIRY_BATCH_SIZE:100}
  redis:
    environment: ${APP_ENV:local}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    real-name: ${BOOTSTRAP_ADMIN_REAL_NAME:}
    student-number: ${BOOTSTRAP_ADMIN_STUDENT_NUMBER:}
    contact: ${BOOTSTRAP_ADMIN_CONTACT:}
  auth:
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:volunteerflow}
      audience: ${JWT_AUDIENCE:volunteerflow-web}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        dependencies:
          include: db,redis

server:
  shutdown: graceful
  forward-headers-strategy: native

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
