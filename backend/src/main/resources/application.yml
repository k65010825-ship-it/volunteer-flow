spring:
  application:
    name: volunteerflow-backend
  config:
    import: optional:file:./config/application-local.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:192.168.40.144}:${DB_PORT:3307}/${DB_NAME:volunteer_flow}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:192.168.40.144}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:2}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

volunteerflow:
  redis:
    environment: ${APP_ENV:local}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    real-name: ${BOOTSTRAP_ADMIN_REAL_NAME:}
    student-number: ${BOOTSTRAP_ADMIN_STUDENT_NUMBER:}
    contact: ${BOOTSTRAP_ADMIN_CONTACT:}
  auth:
    secure-cookie: ${AUTH_SECURE_COOKIE:false}
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:volunteerflow}
      audience: ${JWT_AUDIENCE:volunteerflow-web}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        dependencies:
          include: db,redis

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
