upstream volunteerflow_backend {
    server backend-a:8080;
    server backend-b:8080;
}

log_format stage4d '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   'upstream_addr=$upstream_addr '
                   'request_time=$request_time '
                   'upstream_response_time=$upstream_response_time';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log stage4d;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://volunteerflow_backend;
    }

    location = /api {
        proxy_pass http://volunteerflow_backend;
    }

    location /actuator/ {
        proxy_pass http://volunteerflow_backend;
    }

    location = /actuator {
        proxy_pass http://volunteerflow_backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
